# **Spec abierta v1 — capacidad de motor.** Cada proveedor declara sus capacidades
# y el core/módulos consultan esto en vez de adivinar. Referencia: ARQUITECTURA §8.
#
# Un proveedor = un documento (separados por ---). El adaptador los carga TODOS
# (yaml.loadAll): un solo motor no es el caso.
#
# QUÉ ES UN MOTOR: el motor es el CEREBRO que habla con la mente (claude-code,
# opencode, codex, gemini, shell, ollama, local). Un MÓDULO es una herramienta
# que vive en la casa de la persona (se ejecuta en el extension host, no dentro
# del motor). Por eso la compatibilidad se pregunta al revés: no «qué módulos
# sabe usar este motor» sino «qué motores pueden alojar este módulo».
#
# LOS CAMPOS, y por qué están:
#   - `runtimes`: qué runtime puede alojar el motor hospeda (nodejs|wasm|python).
#     Un módulo con runtime `nodejs` no lo aloja un motor que sólo habla wasm.
#   - `tools`: si el motor puede VER herramientas (módulos que emiten eventos o
#     pintan vistas necesitan un motor con herramientas).
#   - `net`: si el motor llega a la red. Un módulo que pide `net:fetch` necesita
#     un motor con red.
#   - `max_context`: la ventana de contexto que declara el motor.
#   - `local_only`: si el motor es local (nada sale de la casa).
#   - `pricing`: api | local | gratuito.
#   - `cancel_support`: si se puede CANCELAR la ejecución (un motor que no se
#     puede parar, para).
#   - `mcp`: si el motor puede conectarse a la memoria de la casa por MCP
#     (los que no, no pueden prometer la memoria: un agente con memoria es
#     una receta, y la receta no puede mentir).
#   - `source` + `verificado_en`: DE DÓNDE sale el número. Un número sin
#     fuente es una opinión; aquí la fuente es un hecho que se puede revisar.
#   - `adapter`: el fichero que sabe cómo se habla con este motor.
#
# `npm run compat -- <módulo>` cruza esta spec con el manifiesto del módulo y
# dice, motor por motor, si puede alojarlo y por qué. Referencia: docs/MOTORES.md.

---
# Proveedor: claude-code
schema_version: 1
id: "claude-code"
version: "1.0"
capabilities:
  streaming: true
  tools: true
  max_context: 200000
  local_only: false
  pricing: "api"
  cancel_support: true
  mcp: true
  runtimes: ["nodejs", "wasm", "python"]
  net: true
dialecto_deteccion_herramientas: "locales castellano con su fichero u orden"
adapter: "motores/acp-motores.ts"   # cuando usa el bucle por ACP
health_endpoint: null
source: "https://docs.anthropic.com/en/docs/claude-code/overview"
verificado_en: "2026-10-21"

