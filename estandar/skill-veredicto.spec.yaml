# **Spec abierta v1 — el veredicto de las skills de la Tienda.**
# Referencia: `docs/TIENDA.md` §El juez de las skills, `tienda/skills.ts`.
# CI `spec-lint` no la valida (es documental); la implementan el kit
# (`tienda/skills.ts`) y la app (`app/src/main/tienda/veredicto.ts`).
#
# **Cambios:** para cambiar esta spec abre un PR a `estandar/`. Quien produce
# y quien verifica tienen que sacar los MISMOS bytes: el orden de las claves
# es parte del contrato.

schema_version: 1
artefacto: "skills/veredictos.json"
descripcion: >-
  El veredicto firmado del juez de las skills: por skill, si entra en la
  Tienda, con qué riesgo y por qué. La firma cubre la huella del árbol que
  se juzgó, así que la app puede negarse a instalar un árbol que no sea
  exactamente el que el juez miró.

cuerpo_firmado:
  # JSON con las claves en ESTE orden fijo (no se ordenan: el orden es la spec).
  # skills[] viene ordenado por id (comparación de bytes, no de idioma).
  orden: [version, emitido, firmante, catalogoSha256, skills]
  version: 1
  emitido: "<ms desde la época>"
  firmante: "<huella de la clave: 16 hex del sha256 del PEM público>"
  catalogoSha256: "<64 hex>"   # el catálogo EXACTO que se juzgó
  skills:
    - id: "<repo>/<nombre>"
      entra: "<boolean>"
      nivel: "<ok | aviso | fuera>"
      causa: "<por qué, en una frase>"
      medidas:
        orden: [arbolSha256, licencia, commit, ficheros, bytes, ejecutables, tokens, skillMdSha256]
        arbolSha256: "<64 hex>"
        licencia: "<SPDX>"
        commit: "<40 hex>"
        ficheros: "<n>"
        bytes: "<n>"
        ejecutables: "<boolean>"
        tokens: "<n | null>"       # los tokens que ocupa su SKILL.md (null = sin medir)
        skillMdSha256: "<64 hex>"  # el SKILL.md que se leyó ('' si no se leyó)

firma:
  algorithm: "ed25519-sha512"
  firma: "<base64>"        # Ed25519 sobre los bytes UTF-8 del cuerpo_firmado
  signed_at: "<ISO 8601>"
  signed_by: "<la misma huella que `firmante`>"
  hash: "<base64>"         # sha256 de los MISMOS bytes firmados

reglas_del_juez:
  fuera:
    - "id inválido (no coincide con ^[a-z0-9][a-z0-9._/-]{2,119}$)"
    - "no hay commit fijado (40 hex): no se puede probar qué es"
    - "no hay huella del árbol (64 hex): no se puede probar qué se descarga"
    - "licencia fuera de la lista permitida: sin permiso claro para redistribuir"
    - "su SKILL.md no se puede leer (no existe, o le falta «name» o «description»)"
  aviso:
    - "trae scripts ejecutables: hay que pedirlos"
    - "el árbol pesa más de 1 MiB"
    - "trae más de 40 ficheros"
    - "ocupa más de 12.000 tokens de contexto en cada carga"
    - "su nombre no coincide con su carpeta, o su cuerpo está vacío"
  lista_licencias_permitidas:
    [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Unlicense]

medir:
  # Con --medir el juez baja el SKILL.md de cada skill del commit fijado y mide
  # el fichero de verdad: si se lee, cuánto ocupa y si dice lo que dice.
  fichero: "https://raw.githubusercontent.com/<repo>/<commit>/<ruta>/SKILL.md"
  tokens: "caracteres / 4 (la misma cuenta que hace la app en la vista previa)"
  # Los TOPES del juez (los que el veredicto aplica): por encima de ellos, la
  # skill entra AVISADA, no fuera. Los números son parte del contrato: si
  # cambian, cambian aquí y en el juez (y hay un test que lo comprueba).
  topes:
    bytes: 1048576        # 1 MiB (el árbol entero)
    ficheros: 40
    tokens: 12000         # el SKILL.md que se carga en cada turno
  por_que: >-
    El catálogo es lo que alguien escribió; la medida es del fichero que el
    usuario va a leer. Y como la medida va dentro del veredicto firmado, la app
    puede enseñar el coste real de una skill ANTES de descargarla.

verificar:
  pasos:
    - "el JSON se lee y tiene la forma (version, emitido, firmante, catalogoSha256, skills, firma)"
    - "los bytes del cuerpo se rehacen con el orden de claves de esta spec"
    - "sha256(cuerpo) base64 == firma.hash  (el cuerpo no cambió)"
    - "Ed25519(cuerpo, firma.firma) con la clave fijada de confianza"
    - "firma.signed_by == firmante (la firma es de quien dice firmar)"
  si_falla: "el veredicto NO se aplica: la skill queda 'sin medir'"

catalogo_sha256:
  # QUÉ catálogo se juzgó: sha256 del catálogo en forma canónica (claves
  # ordenadas recursivamente, sin espacios). El formato del fichero no altera
  # la huella: el kit lo calcula del JSON, la app del mismo JSON en memoria.
  regla: >-
    La app solo aplica el veredicto si su catálogo tiene esa huella. Si el
    catálogo cambió (app actualizada, tienda con otro catálogo), el veredicto
    no aplica: las skills quedan 'sin medir' y se instala como antes. El juez
    pone el listón, nunca lo quita.

garantías:
  - "NUNCA se estima el ahorro de contexto: eso lo mide la app en la vista
    previa, con el SKILL.md delante. El juez solo mide hechos del catálogo."
  - "Un id repetido en el catálogo no juzga dos veces: la segunda queda fuera."
  - "Sin veredicto firmado (o de otro catálogo), la app NO bloquea nada: sigue
    como antes, pero lo dice ('sin medir')."
