> **Spec abierta v1 — formato de mente portable `.mind`.**
> Referencia: `docs/ARQUITECTURA.md` §7, `docs/SYNC.md`. CI `spec-lint` no la
> valida (es documental); la valida `core/mind/portable-format.ts` en runtime.

schema_version: 1
format: "application/esme.mind+zip"   # o directorio `.mind/` sin comprimir
contenedor:
  # El ZIP es el CONTENEDOR, no el formato: dentro está la misma mente, con las
  # mismas garantías (exclusión mínima, redacción, cognición firmada).
  zip: >-
    Orden canónico, fecha fija (1980-01-01), sin atributos de plataforma: la
    misma mente da el mismo fichero. Implementación propia en bytes
    (`core/mind/zip.ts`), sin depender de la versión del `zip` del sistema.
  directorios_vacios: >-
    Un ZIP guarda ficheros, no carpetas vacías: al descomprimir se crean los
    directorios que el formato exige (`embeddings/`, `crs-delta/`). Son parte
    del formato, no del contenido.
  identidad: >-
    La identidad de una mente es SEMÁNTICA (`cognition.sig`), no el hash del
    fichero: el `created_at` de `metadata.json` cambia en cada exportación.
structure:
  embeddings/          # pesos del codificador (ONNX) + vectores binarios
  metadata.json        # schema_version, created_at, motor, counts, redacción aplicada
  cognition.sig        # firma Ed25519 del hash de cognición (detecta corrupción)
  crs-delta/           # deltas entre versiones (recodificación parcial)
  redaction-rules.json # patrones extra del usuario, además de los mínimos
  exclusion-list.json  # rutas que NUNCA se exportan (mínimo: EXCLUSION_MINIMA)
  rumbo.json           # OPCIONAL: para qué trabaja la mente (pilares y objetivos)

metadata.json:
  required: [schema_version, created_at, motor, recall, counts]
  schema_version: 1
  motor: "EmbeddingGemma-300M int8"
  exclusion_must_include: [work/**, company/**, .env*, *.pem, *.key]

rumbo.json:
  # Opcional: las mentes viejas no lo tienen. Si está, tiene que valer (o no vale la mente entera).
  opcional: true
  forma: "{ version: 1, pilares: [{id, texto, creado}], objetivos: [{id, texto, estado, creado, cerrado, pilar}] }"
  estados: [activo, hecho, pausado]
  topes: { pilares: 7, objetivos: 60, texto: 200 }
  nota: >-
    El rumbo es de la mente, no de la app: viaja con ella. Si un .mind no lo
    tiene, sigue siendo una mente válida (solo pierde el para qué).
  espejo_python: >-
    El dueño del dato es el Python (`daimon/rumbo.py`): el que ESCRIBE
    normaliza (lo que no vale se cae) y el que VERIFICA exige el contrato.
    `core/mind/rumbo.ts` es el espejo exacto: las dos lenguas tienen que sacar
    los MISMOS bytes (`json.dumps(sano, ensure_ascii=False, indent=1) + "\n"`),
    mismo orden de claves. Comprobado byte a byte contra el Python real.
  redactado: >-
    El rumbo pasa por la redacción como cualquier otro texto que sale del
    equipo: un secreto en un pilar no viaja en claro.

garantías:
  - NINGÚN texto se exporta sin pasar por core/mind/redaction.ts (secretos bajo
    [SECRET:<tipo>], sin contenido residual en el paquete). El rumbo también.
  - La lista de exclusión mínima es inviolable: puede añadirse, nunca quitarse.
  - cognition.sig = hash semántico del estado, no del binario: misma mente
    semántica con distinto cuantizado sigue verificando.
  - crs-delta permite actualizar sin re-embedding completo (compat coseno 0,990
    demostrado el 12-oct al cambiar el codificador).
