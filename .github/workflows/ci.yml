name: CI — el runtime de la mente local

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core — lint + tests + spec-lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # la era es abierta: el kit tiene que compilar y dar lo mismo en
        # cualquier máquina donde alguien construya un módulo
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: la puerta de la Prueba 0 (el número no puede empeorar)
        run: npx vitest run tests/prueba0.test.ts
      # se construyen TODOS los módulos, también los que llegan de fuera: el
      # lint de specs mira que la entrada exista, y si no está construida el
      # fallo es del que llega, no de su módulo
      - run: npm run build:modulos
      - run: npm run spec:lint
      - name: offline — el router decide sin red
        run: npm run test:offline
      - name: el paquete se compila (lo que se publica es lo que compila)
        run: npm run build
      - name: el paquete se arma (lo que se publica, byte a byte)
        run: npm pack --dry-run

  build:
    name: módulos — build + lint de manifiesto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build:modulos
      - run: npm run spec:lint

  entrada:
    name: la puerta de entrada — un módulo cualquiera, de principio a fin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # la puerta se comprueba con un módulo NUEVO, hecho aquí mismo: si
      # construir, medir y juzgar dejaran de funcionar, la CI lo dice en el
      # PR — antes de que lo descubra quien publica.
      - name: el módulo de cualquiera nace y entra
        run: |
          npm run crear:modulo -- --id esme.ci.puerta --nombre "Puerta de la CI" --dir /tmp/puerta-ci
          npm run verificar:modulo -- /tmp/puerta-ci
      - name: la puerta se cierra cuando tiene que cerrarse
        run: npx vitest run tests/entrada.test.ts

  puertas:
    name: las puertas — todas, en una carrera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # cada puerta de la casa, probada con material de juguete: crear,
      # verificar, publicar, juzgar, medir, ejecutar, delegar… Una puerta que no
      # se prueba se pudre, y no te enteras hasta que alguien la usa.
      - name: todas las puertas, en pie
        run: npm run puertas

  motores:
    name: motores — cada módulo, en cada motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # la spec de motores y el código tienen que contar lo mismo, y cada
      # módulo tiene que poder ser alojado por ALGO (un módulo que ningún
      # motor puede alojar es un módulo que no sirve)
      - name: la spec de motores cuadra con el código
        run: npm run spec:lint
      - name: cada módulo puede ser alojado por algún motor
        run: |
          for d in modulos/*/; do
            [ -f "$d/module.yaml" ] || continue
            echo "— $d"
            npm run compat -- "$d"
          done

  firma:
    name: tienda — la tienda publicada se verifica (sin llaves) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: la raíz congelada verifica el índice y los artefactos
        run: npm run verificar
      - name: verificar índice (test de firma)
        run: npx vitest run tests/tienda-firma.test.ts tests/tienda-publicar.test.ts
