name: spec-lint — nada entra que incumpla las specs

on:
  pull_request:
    paths:
      - "modulos/**"
      - "estandar/**"
      - "tienda/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26 }
      - run: npm ci
      # los módulos se construyen antes del lint: la entrada tiene que existir,
      # y el que llega de fuera no puede tener un fallo que no es suyo
      - run: npm run build:modulos
      - run: npm run spec:lint
      - name: los benchs difundidos se REPRODUCEN (dos veces)
        run: npx vitest run tests/bench.test.ts
